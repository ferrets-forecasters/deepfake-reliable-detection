[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake_detection"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchaudio>=2.2",
    "transformers>=4.40",
    "openai-whisper",
    "numpy",
    "opencv-python",
    "scikit-learn",
    "matplotlib",
    "mediapipe",
    "tqdm",
    "pyyaml",
    "av",
    "pandas",
    "speechbrain>=1.1.1",
]

[project.optional-dependencies]
download = ["gdown", "yt-dlp", "requests"]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
