seed: 42

paths:
  # Resolved relative to the project root (two levels above this repo: repo/deepfake_detection/../..).
  # Override with the DEEPFAKE_PROJECT_ROOT environment variable if the repo is used standalone.
  datasets_root: datasets
  models_root: models
  # results/ always holds these four folders; each holds one folder per named element
  # (a model on a dataset, a benchmark run, an analysis topic, an XAI method on a model and dataset).
  inferences_root: results/inferences
  metrics_root: results/metrics
  analyses_root: results/analyses
  xai_root: results/xai

# Dataset folders, manifest layout and the dataset registry live in datasets.yaml.
datasets_config: datasets.yaml

split:
  train: 0.6
  val: 0.2
  test: 0.2
  level: subject

preprocessing:
  segment_seconds: 2
  video:
    num_frames: 16
    image_size: 224
    face_detector_fps: 2
  audio:
    sample_rate: 16000
    mel_frames: 3000

encoders:
  visual:
    model_id: MCG-NJU/videomae-base
    hidden_size: 768
    frozen: true
  audio:
    model_id: openai/whisper-medium
    hidden_size: 1024
    frozen: true

model:
  concat_dim: 1792
  gru_hidden: 256
  gru_layers: 2
  gru_dropout: 0.3
  visual_expert_hidden: 256
  gate_hidden: 64
  cross_attn_heads: 8
  num_classes: 2

train:
  optimizer: adamw
  learning_rate: 1.0e-4
  scheduler: cosine_annealing
  batch_size: 16
  max_epochs: 60
  early_stopping_patience: 12
  early_stopping_metric: val_f1
  swa_start_epoch: 45
  focal_gamma: 1.0
  focal_alpha: 0.75
  label_smoothing: 0.05
  domain_adversarial_weight: 0.10
  gate_routing_aux_weight: 0.10
