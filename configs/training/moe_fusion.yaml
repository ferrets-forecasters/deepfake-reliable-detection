name: moe_fusion
description: >
  PRIMARY: MoE Fusion trained on all 5 datasets combined (subject_split 60/20/20 each).
  Reports AP/AUC/F1/alpha on combined test set spanning all manipulation modalities.
group: main

model:
  type:        moe
  backbone:    gru
  hidden_dim:  256
  num_layers:  2
  dropout:     0.3
  gate_hidden: 64

data:
  experiment: all_datasets_combined
  val_ratio:  0.20
  seed:       42

training:
  epochs:          60
  batch_size:      16
  lr:              1.0e-4
  weight_decay:    1.0e-3
  patience:        12
  label_smoothing: 0.05
  modal_drop_p:    0.25
  feat_noise:      0.01
  mixup_alpha:     0.2

loss:
  dann_lambda:             0.1
  focal_gamma:             1.0
  focal_alpha:             0.75
  gate_supervision_weight: 0.1

swa:
  start: 0.75
  lr:    5.0e-5

debug:
  sanity_fraction: null

